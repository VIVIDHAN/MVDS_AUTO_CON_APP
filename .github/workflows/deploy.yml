name: Deploy MVDS Dealership Platform (API & Android APK)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # =========================================================================
  # STAGE 1: Backend Deployment to Lytic_Server_01 (AWS EC2 Mumbai)
  # =========================================================================
  deploy-backend:
    name: Deploy Backend to Lytic_Server_01
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: SSH and Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true
        with:
          host: ${{ secrets.EC2_HOST || '3.108.146.201' }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            echo "=========================================="
            echo "🚀 Deploying MVDS Backend to Lytic_Server_01"
            echo "=========================================="
            mkdir -p /home/ubuntu/mvds-backend
            cd /home/ubuntu/mvds-backend

            # Pull latest changes if git initialized, otherwise sync
            if [ -d ".git" ]; then
              git fetch origin main
              git reset --hard origin/main
            fi

            echo "📦 Installing backend production dependencies..."
            npm install --production

            echo "🔄 Running DB migrations & seeding..."
            node scripts/setupDb.js || true

            echo "⚡ Reloading PM2 mvds-backend service..."
            pm2 reload mvds-backend || pm2 start server.js --name mvds-backend
            pm2 save
            echo "✅ MVDS Backend is live on Port 5002 / https://lytic.co.in/api/mvds/"

  # =========================================================================
  # STAGE 2: Build & Package Android Mobile APK (GitHub 16GB Cloud Runner)
  # =========================================================================
  build-apk:
    name: Build & Package Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'MVDSApp/package-lock.json'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Mobile Dependencies
        run: |
          cd MVDSApp
          npm install --legacy-peer-deps

      - name: Bundle React Native Assets & Compile Release APK
        run: |
          cd MVDSApp/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

          # Locate compiled release APK
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find app/build/outputs/apk -name "*.apk" 2>/dev/null | head -n 1)
          fi

          if [ -n "$APK_FILE" ]; then
            echo "Found compiled APK: $APK_FILE"
            cp "$APK_FILE" ../../mvds-latest.apk
            echo "APK_READY=true" >> $GITHUB_ENV
          else
            echo "No APK found!"
            echo "APK_READY=false" >> $GITHUB_ENV
          fi

      - name: Upload APK as GitHub Release Artifact
        if: env.APK_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mvds-latest-apk
          path: mvds-latest.apk
          retention-days: 14

      - name: Deploy APK to Production Server Public Download Directory
        if: env.APK_READY == 'true' && secrets.EC2_SSH_KEY != ''
        uses: appleboy/scp-action@v0.1.7
        continue-on-error: true
        with:
          host: ${{ secrets.EC2_HOST || '3.108.146.201' }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: "mvds-latest.apk"
          target: "/var/www/mvds-downloads/"

  # =========================================================================
  # STAGE 3: Team Officer Notifications
  # =========================================================================
  notify:
    name: Notify Team Officers
    needs: [deploy-backend, build-apk]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Log Deployment Status
        run: |
          echo "=========================================="
          echo "🎉 MVDS Dealership Platform Deployment Completed!"
          echo "🌐 Live API Health: https://lytic.co.in/api/mvds/health"
          echo "📱 Direct APK URL: https://lytic.co.in/mvds-latest.apk"
          echo "=========================================="
